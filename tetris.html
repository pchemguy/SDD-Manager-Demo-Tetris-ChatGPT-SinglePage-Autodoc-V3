<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris</title></head><body>
<script>
(() => {
'use strict';
// PURE-BEGIN
/** Canonical settings and deterministic classic game domain. */
const DEFAULT_SETTINGS = Object.freeze({ghost:'dynamic',hardDrop:'on',next:'on',hardDropLock:'general',lock:'interval',hold:'on'});
const KINDS = ['I','J','L','O','S','T','Z'];
const SHAPES = {
 I:[[0,1],[1,1],[2,1],[3,1]], J:[[0,0],[0,1],[1,1],[2,1]],
 L:[[2,0],[0,1],[1,1],[2,1]], O:[[1,0],[2,0],[1,1],[2,1]],
 S:[[1,0],[2,0],[0,1],[1,1]], T:[[1,0],[0,1],[1,1],[2,1]],
 Z:[[0,0],[1,0],[1,1],[2,1]]
};
function pieceCells(piece) {
 let points=SHAPES[piece.kind].map(p=>p.slice());
 if(piece.kind!=='O') for(let n=0;n<piece.orientation;n++) points=points.map(([x,y])=>[(piece.kind==='I'?3:2)-y,x]);
 return points.map(([x,y])=>[x+piece.x,y+piece.y]);
}
function emptyBoard(){return Array.from({length:20},()=>Array(10).fill(null));}
function gravityInterval(level){return Math.max(100,1000-75*(level-1));}
function createEngine(random = Math.random) {
 let s, events=[];
 function reset(){s={phase:'ready',gameId:null,board:emptyBoard(),active:null,score:0,lines:0,level:1,bonuses:0,held:null,holdUsed:false,queue:[],gravityElapsedMs:0,groundedElapsedMs:null,groundIntervalMs:1000};}
 reset();
 function valid(piece){return pieceCells(piece).every(([x,y])=>x>=0&&x<10&&y>=0&&y<20&&!s.board[y][x]);}
 function syncGround(){
  if(!s.active){s.groundedElapsedMs=null;return;}
  const grounded=!valid({...s.active,y:s.active.y+1});
  if(!grounded)s.groundedElapsedMs=null;
  else if(s.groundedElapsedMs===null){s.groundedElapsedMs=0;s.groundIntervalMs=gravityInterval(s.level);}
 }
 function nextKind(){return KINDS[Math.min(6,Math.floor(random()*7))];}
 function spawn(kind=nextKind()){
  const coords=SHAPES[kind],minX=Math.min(...coords.map(p=>p[0])),maxX=Math.max(...coords.map(p=>p[0]));
  s.active={kind,orientation:0,x:Math.floor((10-(maxX-minX+1))/2)-minX,y:-Math.min(...coords.map(p=>p[1])),penetrator:false};
  s.gravityElapsedMs=0;s.groundedElapsedMs=null;
  if(!valid(s.active)){s.phase='over';s.active=null;}else syncGround();
 }
 function move(dx,dy){
  const p={...s.active,x:s.active.x+dx,y:s.active.y+dy};
  if(!valid(p))return false;s.active=p;syncGround();return true;
 }
 function lock(){
  if(!s.active||!valid(s.active))return;
  for(const [x,y] of pieceCells(s.active))s.board[y][x]=s.active.kind;
  s.holdUsed=false;spawn();
 }
 function act(action,settings=DEFAULT_SETTINGS){
  if(s.phase!=='running'||!s.active)return false;
  if(action==='left')return move(-1,0);
  if(action==='right')return move(1,0);
  if(action==='softDrop')return move(0,1);
  if(action==='rotateCW'||action==='rotateCCW'){
   const p={...s.active,orientation:(s.active.orientation+(action==='rotateCW'?1:3))%4};
   if(valid(p)){s.active=p;syncGround();return true;}
  }
  return false;
 }
 function advance(ms,settings=DEFAULT_SETTINGS){
  if(s.phase!=='running'||!Number.isFinite(ms)||ms<0)return;
  let remaining=ms;
  while(remaining>0&&s.phase==='running'){
   const g=gravityInterval(s.level);
   let step=Math.min(remaining,g-s.gravityElapsedMs);
   if(s.groundedElapsedMs!==null)step=Math.min(step,Math.max(0,s.groundIntervalMs-s.groundedElapsedMs));
   s.gravityElapsedMs+=step;
   if(s.groundedElapsedMs!==null)s.groundedElapsedMs+=step;
   remaining-=step;
   if(s.groundedElapsedMs!==null&&s.groundedElapsedMs>=s.groundIntervalMs){lock();continue;}
   if(s.gravityElapsedMs>=g){s.gravityElapsedMs-=g;move(0,1);}
  }
 }
 return {
  /* ENGINE-API */
  start(gameId){reset();s.gameId=gameId;s.phase='running';events=[];spawn();},
  act,advance,
  setPaused(paused){if(s.phase==='running'&&paused)s.phase='paused';else if(s.phase==='paused'&&!paused)s.phase='running';},
  view(){return structuredClone({...s,activeCells:s.active?pieceCells(s.active):[]});},
  drainEvents(){const out=events;events=[];return out;}
 };
}
// PURE-END
})();
</script></body></html>
